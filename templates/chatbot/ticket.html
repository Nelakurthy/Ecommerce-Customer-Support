<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Create Support Ticket</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

</head>

<body class="bg-light">

<nav class="navbar navbar-dark bg-dark">

    <div class="container">

        <a
            class="navbar-brand"
            href="/"
        >
            E-Commerce Support
        </a>

        <div>

            <a
                href="/"
                class="btn btn-outline-light btn-sm"
            >
                Chat
            </a>

            <a
                href="/history/"
                class="btn btn-outline-light btn-sm"
            >
                History
            </a>

            <a
                href="/tickets/"
                class="btn btn-outline-light btn-sm"
            >
                My Tickets
            </a>

        </div>

    </div>

</nav>


<div class="container mt-5">

    <div class="row justify-content-center">

        <div class="col-md-7">

            <div class="card shadow">

                <div class="card-body p-4">

                    <h3 class="mb-4">
                        Create Support Ticket
                    </h3>

                    <div
                        id="message"
                        class="alert d-none"
                    ></div>

                    <form id="ticketForm">

                        {% csrf_token %}

                        <div class="mb-3">

                            <label class="form-label">
                                Subject
                            </label>

                            <input
                                type="text"
                                name="subject"
                                id="subject"
                                class="form-control"
                                placeholder="Example: Damaged product"
                                required
                            >

                        </div>


                        <div class="mb-3">

                            <label class="form-label">
                                Description
                            </label>

                            <textarea
                                name="description"
                                id="description"
                                class="form-control"
                                rows="5"
                                placeholder="Describe your issue..."
                                required
                            ></textarea>

                        </div>


                        <button
                            type="submit"
                            class="btn btn-primary w-100"
                        >
                            Create Ticket
                        </button>

                    </form>

                </div>

            </div>

        </div>

    </div>

</div>


<script>

const form =
    document.getElementById("ticketForm");

const messageBox =
    document.getElementById("message");


form.addEventListener(
    "submit",
    async function(event) {

        event.preventDefault();

        const formData =
            new FormData(form);

        try {

            const response =
                await fetch(
                    "/ticket/",
                    {
                        method: "POST",
                        body: formData
                    }
                );

            const data =
                await response.json();

            messageBox.classList.remove(
                "d-none"
            );

            if (response.ok) {

                messageBox.className =
                    "alert alert-success";

                messageBox.textContent =
                    data.message +
                    " Ticket ID: " +
                    data.ticket_id;

                form.reset();

            } else {

                messageBox.className =
                    "alert alert-danger";

                messageBox.textContent =
                    data.error;

            }

        } catch (error) {

            messageBox.className =
                "alert alert-danger";

            messageBox.classList.remove(
                "d-none"
            );

            messageBox.textContent =
                "Unable to create ticket.";

        }

    }
);

</script>

</body>

</html>
