
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Register - E-Commerce Support</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <style>
        body {
            background-color: #f4f6f9;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .register-card {
            width: 100%;
            max-width: 450px;
            border: none;
            border-radius: 15px;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.1);
        }

        .card-header {
            background-color: #212529;
            color: white;
            text-align: center;
            padding: 20px;
            border-radius: 15px 15px 0 0 !important;
        }

        .card-body {
            padding: 30px;
        }

        .form-control {
            border-radius: 8px;
            padding: 10px 12px;
        }

        .btn-register {
            width: 100%;
            border-radius: 8px;
            padding: 10px;
        }
    </style>
</head>

<body>

<div class="container">

    <div class="card register-card mx-auto">

        <div class="card-header">
            <h3 class="mb-0">Create Account</h3>
            <small>E-Commerce Customer Support</small>
        </div>

        <div class="card-body">

            <form method="POST">

                {% csrf_token %}

                <div class="mb-3">
                    <label for="username" class="form-label">
                        Username
                    </label>

                    <input
                        type="text"
                        id="username"
                        name="username"
                        class="form-control"
                        placeholder="Enter username"
                        required
                    >
                </div>


                <div class="mb-3">
                    <label for="email" class="form-label">
                        Email
                    </label>

                    <input
                        type="email"
                        id="email"
                        name="email"
                        class="form-control"
                        placeholder="Enter email address"
                        required
                    >
                </div>


                <div class="mb-3">
                    <label for="password" class="form-label">
                        Password
                    </label>

                    <input
                        type="password"
                        id="password"
                        name="password"
                        class="form-control"
                        placeholder="Enter password"
                        required
                    >
                </div>


                <button
                    type="submit"
                    class="btn btn-primary btn-register">
                    Register
                </button>

            </form>


            <div class="text-center mt-4">

                <p class="mb-1">
                    Already have an account?
                </p>

                <a href="/login/" class="text-decoration-none">
                    Login here
                </a>

            </div>


            <div class="text-center mt-3">

                <a
                    href="/"
                    class="text-decoration-none text-secondary">
                    ← Back to Home
                </a>

            </div>

        </div>

    </div>

</div>

</body>
</html>
